engine: knitr
lang: es

# Bibliography is defined per-project in the YAML header of the manifest
# file (index.qmd / memo.qmd / ppt.qmd / report.qmd). Each project lists
# the bib files it wants (local + bib/references.bib as fallback).
link-citations: true
colorlinks: true

execute:
  eval: true
  echo: false
  freeze: false
  warning: false
  message: false

crossref:
  fig-title: Figura
  tbl-title: Tabla
  eq-title: Ecuación
  eq-prefix: ec.
  tbl-prefix: tabla
  fig-prefix: figura
  sec-prefix: sección

toc-title: Contenido

profile:
  group: [book, revealjs, docx, html]
  default: book
